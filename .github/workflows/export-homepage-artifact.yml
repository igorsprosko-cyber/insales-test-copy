name: Export homepage artifact

on:
  pull_request:
    types: [opened]
    branches: [v2.3-page-standardization]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.3-page-standardization
          fetch-depth: 2
      - name: Prepare files
        run: |
          mkdir -p export
          cp index.liquid export/index.liquid
          git diff 8370a67df342363769a245746f9faf6eb19d071f..cffb9d0a641646c98b25d44726781d4b7ef7a83c -- index.liquid > export/index.diff
          printf 'index lines: '; wc -l < export/index.liquid
          printf 'diff lines: '; wc -l < export/index.diff
      - uses: actions/upload-artifact@v4
        with:
          name: VELES-index-v2.3-final
          path: export/
      - name: Remove export workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/export-homepage-artifact.yml || true
          git commit -m 'chore: remove export workflow' || true
          git push origin v2.3-page-standardization || true
