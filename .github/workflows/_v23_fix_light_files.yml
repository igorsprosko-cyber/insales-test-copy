name: V2.3 fix Veles Light file references

on:
  push:
    branches: [v2.3-page-standardization]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.3-page-standardization
          fetch-depth: 0

      - name: Verify supplied InSales CDN URLs
        run: |
          set -e
          curl -fsSIL --max-time 20 'https://cdn.insales-shop.ru/files/1/3313/132902129/original/%D0%BF%D1%80%D0%B5%D0%B7%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F.png' >/dev/null
          curl -fsSIL --max-time 20 'https://cdn.insales-shop.ru/files/1/3337/132902153/original/%D0%BB%D0%BE%D0%B3%D0%BE26.jpg' >/dev/null
          echo 'CDN diagnostic: both supplied URLs are reachable.'

      - name: Replace only the two file references
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.liquid')
          s = p.read_text(encoding='utf-8')
          old_photo = 'veles-light-photo.jpg'
          old_logo = 'veles-light-logo.png'
          new_photo = 'презентация.png'
          new_logo = 'лого26.jpg'
          photo_n = s.count(old_photo)
          logo_n = s.count(old_logo)
          if photo_n == 0 or logo_n == 0:
              raise SystemExit(f'Expected references not found: photo={photo_n}, logo={logo_n}')
          s = s.replace(old_photo, new_photo).replace(old_logo, new_logo)
          p.write_text(s, encoding='utf-8')
          print(f'Replaced photo references: {photo_n}; logo references: {logo_n}')
          PY

      - name: Verify final Liquid references
        run: |
          grep -n "презентация.png.*file_url\|лого26.jpg.*file_url" index.liquid
          if grep -n "veles-light-photo.jpg\|veles-light-logo.png" index.liquid; then
            echo 'ERROR: old references remain'
            exit 1
          fi

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.liquid
          git commit -m 'fix: use actual InSales Veles Light files' || exit 0
          git push origin HEAD:v2.3-page-standardization
